name: Build and Push Image

on:
    push:
        branches: [main]
        paths-ignore:
            - 'k8s/**'

concurrency:
    group: build-and-push-image-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository}}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            version: ${{ steps.version.outputs.version }}
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Read version
              id: version
              run: |
                VERSION=$(cat VERSION)
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Check version is not already published
              env:
                IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                VERSION: ${{ steps.version.outputs.version }}
              run: |
                IMAGE="${IMAGE,,}"
                REF="${IMAGE}:${VERSION}"
                if OUTPUT=$(docker buildx imagetools inspect "$REF" 2>&1); then
                   echo "::error title=Version already exists::${REF} is already published. Bump the VERSION file."
                   exit 1
                elif echo "$OUTPUT" | grep -qiE "not found|manifest unknown|name unknown"; then
                  echo "✅ ${REF} does not exist yet, continuing."
                else
                  echo "::error title=Registry check failed::Could not verify ${REF}: ${OUTPUT}"
                  exit 1
                fi

            - name: Generate tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                    tags: |
                        type=raw,value=${{ steps.version.outputs.version }}
                        type=sha,prefix=sha-,format=short

            - name: Build and push
              id: build
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                platforms: linux/amd64,linux/arm64
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                build-args: |
                    APP_VERSION=${{ steps.version.outputs.version }}
                    GIT_SHA=${{ github.sha }}
                    BUILD_SOURCE=github-actions
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Summary
              env:
                DIGEST: ${{ steps.build.outputs.digest }}
                TAGS: ${{ steps.meta.outputs.tags }}
                VERSION: ${{ steps.version.outputs.version }}
                IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              run: |
                IMAGE="${IMAGE,,}"
                {
                  echo "## 🐳 Published Image"
                  echo ""
                  echo "| Field | Value |"
                  echo "|---|---|"
                  echo "| Image | \`${IMAGE}\` |"
                  echo "| Version | \`${VERSION}\` |"
                  echo "| Digest | \`${DIGEST}\` |"
                  echo ""
                  echo "### Tags"
                  echo '```'
                  echo "${TAGS}"
                  echo '```'
                  echo "### Pull by digest (inmutable)"
                  echo '```bash'
                  echo "docker pull ${IMAGE}@${DIGEST}"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"

    update-manifest:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: write
      env:
        MANIFEST: k8s/deployment.yaml
        CONTAINER_NAME: supply-chain-container
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: main

        - name: set image digest in manifest
          env:
            IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            DIGEST: ${{ needs.build.outputs.digest }}
            VERSION: ${{ needs.build.outputs.version }}
          run: |
            IMAGE="${IMAGE,,}"
            export IMAGE_REF="${IMAGE}:${VERSION}@${DIGEST}"

            yq -i '(.spec.template.spec.containers[] | select(.name == strenv(CONTAINER_NAME))).image = strenv(IMAGE_REF)' "$MANIFEST"

            echo "Updated image -> ${IMAGE_REF}"
            git diff -- "$MANIFEST"

        - name: Commit and push changes
          env:
            VERSION: ${{ needs.build.outputs.version }}
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

            git add "$MANIFEST"
            if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
            fi

            git commit -m "chore(deploy): update image to ${VERSION}@${{ needs.build.outputs.digest }} [skip ci]"
            git pull --rebase origin main
            git push origin main